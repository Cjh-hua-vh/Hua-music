mybatis.typeAliasesPackage=com.example.hua.model.domain
mybatis.mapperLocations=classpath:mapper/*.xml
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=GMT+8
#热部署生效
spring.devtools.restart.enabled=true
#设置重启的目录
spring.devtools.restart.additional-paths=src/main/java
#classpath目录下的WEB-INF文件夹内容修改不重启
spring.devtools.restart.exclude=WEB-INF/**
# 关闭CONDITIONS EVALUATION REPORT及自动配置内容向控制台的输出
logging.level.org.springframework.boot.autoconfigure=ERROR
spring.profiles.active=dev
#app.security.cors.allowed-origins=*

# JWT：secret 至少 32 字节，生产环境请改为环境变量注入
app.jwt.secret=hua-music-jwt-secret-key-change-me-in-production-2026
app.jwt.expire-hours=24
